/* ── CART BAR ── */
function CartBar({ cart, onCheckout }) {
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const count = cart.reduce((s, i) => s + i.qty, 0);
  if (!count) return null;
  return (
    <div style={{
      position:"fixed", bottom:0, left:0, right:0, zIndex:100,
      background:`linear-gradient(135deg,${C.ember},${C.orange})`,
      padding:"12px 20px", display:"flex", alignItems:"center", justifyContent:"space-between",
      boxShadow:"0 -4px 20px rgba(0,0,0,0.5)",
    }}>
      <span style={{color:C.white, fontFamily:"sans-serif", fontSize:14}}>
        🛒 {count} 件
      </span>
      <span style={{color:C.white, fontWeight:900, fontSize:18, fontFamily:"Georgia,serif"}}>
        ${total.toFixed(2)} AUD
      </span>
      <button onClick={onCheckout} style={{
        background:C.white, color:C.ember, border:"none",
        borderRadius:20, padding:"9px 20px", fontWeight:800,
        fontSize:14, cursor:"pointer", fontFamily:"sans-serif",
      }}>确认下单</button>
    </div>
  );
}

/* ── BROTH PAGE ── */
function BrothPage({ mode, titleText, subText, allowSkip, onNext, onBack }) {
  // mode: "single"=pick 1 | "twin"=pick 2 | "benz"=pick 3 | "choose"=pick pot type first
  const [potType, setPotType] = useState(mode === "choose" ? null : mode);
  const [sel, setSel] = useState([]);
  const max = potType === "twin" ? 2 : potType === "benz" ? 3 : 1;

  const toggle = (id) => setSel(prev => {
    if (prev.includes(id)) return prev.filter(x => x !== id);
    if (prev.length >= max) return [...prev.slice(1), id];
    return [...prev, id];
  });

  const canNext = potType && sel.length === max;

  return (
    <div style={{minHeight:"100vh", background:C.bg, color:C.cream, fontFamily:"Georgia,serif", paddingBottom:80}}>
      <NavBar title={titleText || "选择锅底"} sub={subText} onBack={onBack} />
      <div style={{padding:"20px 18px"}}>

        {/* Pot type selector — only when mode=choose */}
        {mode === "choose" && (
          <div style={{marginBottom:20}}>
            <div style={{fontSize:13, color:C.creamD, marginBottom:10, fontFamily:"sans-serif"}}>选择锅型</div>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8}}>
              {[
                {id:"single", icon:"🫕", label:"单锅",   sub:"选1种"},
                {id:"twin",   icon:"☯️", label:"鸳鸯锅", sub:"选2种"},
                {id:"benz",   icon:"✤",  label:"奔驰锅", sub:"选3种"},
              ].map(p => (
                <button key={p.id} onClick={() => { setPotType(p.id); setSel([]); }} style={{
                  background: potType===p.id ? `linear-gradient(135deg,${C.goldD},${C.gold})` : C.card,
                  color: potType===p.id ? C.bg : C.cream,
                  border:`1.5px solid ${potType===p.id ? C.gold : C.border}`,
                  borderRadius:12, padding:"12px 6px", cursor:"pointer", fontFamily:"Georgia,serif",
                }}>
                  <div style={{fontSize:22, marginBottom:3}}>{p.icon}</div>
                  <div style={{fontSize:13, fontWeight:700}}>{p.label}</div>
                  <div style={{fontSize:10, opacity:0.7, fontFamily:"sans-serif"}}>{p.sub}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* Broth grid */}
        {(mode !== "choose" || potType) && (
          <>
            <div style={{display:"flex", justifyContent:"space-between", marginBottom:12, alignItems:"center"}}>
              <div style={{fontSize:13, color:C.creamD, fontFamily:"sans-serif"}}>
                {mode === "single" ? "选择锅底（1种）" : `选择锅底（选 ${max} 种）`}
              </div>
              {sel.length > 0 && (
                <span style={{background:C.gold, color:C.bg, fontSize:11, fontWeight:800, padding:"3px 10px", borderRadius:20, fontFamily:"sans-serif"}}>
                  已选 {sel.length}/{max}
                </span>
              )}
            </div>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
              {BROTHS.map(b => {
                const on = sel.includes(b.id);
                const disabled = !on && sel.length >= max;
                return (
                  <div key={b.id} onClick={() => !disabled && toggle(b.id)} style={{
                    background: on ? `${b.color}99` : C.card,
                    border:`2px solid ${on ? b.acc : C.border}`,
                    borderRadius:16, padding:"16px 12px", textAlign:"center",
                    cursor: disabled ? "default" : "pointer",
                    opacity: disabled ? 0.4 : 1, transition:"all 0.2s",
                  }}>
                    <div style={{fontSize:34, marginBottom:6}}>{b.emoji}</div>
                    <div style={{fontSize:14, fontWeight:800, color:C.cream, marginBottom:2}}>{b.zh}</div>
                    <div style={{fontSize:10, color:C.creamD, fontFamily:"sans-serif"}}>{b.en}</div>
                    {on && <div style={{marginTop:8, background:b.acc, borderRadius:10, padding:"2px 8px", fontSize:10, color:C.white, fontFamily:"sans-serif"}}>✓ 已选</div>}
                  </div>
                );
              })}
            </div>
          </>
        )}

        <Btn label="下一步：加购配菜 →" disabled={!canNext} onClick={() => onNext(sel)} />
        {allowSkip && (
          <button onClick={() => onNext([])} style={{
            width:"100%", background:"transparent", color:C.creamD,
            border:`1px solid ${C.border}`, borderRadius:12, padding:"13px",
            fontSize:13, cursor:"pointer", marginTop:10, fontFamily:"sans-serif",
          }}>不升级，纯享鱼 →</button>
        )}
      </div>
    </div>
  );
}

/* ── ADDONS PAGE ── */
function AddonsPage({ cart, setCart, onBack }) {
  const [cat, setCat] = useState("热销首选");
  const [portionTab, setPortionTab] = useState({});

  const items = cat === "热销首选"
    ? ADDONS.filter(a => a.hot)
    : ADDONS.filter(a => a.cat === cat);

  const getPortion = (id) => portionTab[id] || "full";
  const halfP = (p) => Math.ceil(p * 60) / 100;
  const cKey = (id, por) => `${id}_${por}`;
  const getQty = (id, por) => cart.find(c => c.cKey === cKey(id,por))?.qty || 0;

  const add = (item, por) => {
    if (item.price === null) return;
    const k = cKey(item.id, por);
    const price = por === "half" ? halfP(item.price) : item.price;
    setCart(prev => {
      const ex = prev.find(c => c.cKey === k);
      if (ex) return prev.map(c => c.cKey===k ? {...c, qty:c.qty+1} : c);
      return [...prev, {...item, cKey:k, portion:por, price, zh:`${item.zh}${por==="half"?"（半份）":""}`}];
    });
  };

  const sub = (id, por) => {
    const k = cKey(id, por);
    setCart(prev => {
      const ex = prev.find(c => c.cKey===k);
      if (!ex) return prev;
      if (ex.qty === 1) return prev.filter(c => c.cKey!==k);
      return prev.map(c => c.cKey===k ? {...c, qty:c.qty-1} : c);
    });
  };

  return (
    <div style={{minHeight:"100vh", background:C.bg, color:C.cream, fontFamily:"Georgia,serif", paddingBottom:120}}>
      <NavBar title="加购配菜" sub="荤菜素菜可选整份或半份" onBack={onBack} />

      {/* Tabs */}
      <div style={{display:"flex", gap:8, padding:"10px 18px", overflowX:"auto", background:C.surface, borderBottom:`1px solid ${C.border}`, scrollbarWidth:"none"}}>
        {CATS.map(c => (
          <button key={c} onClick={() => setCat(c)} style={{
            background: cat===c ? (c==="儿童套餐" ? "#4A7A3A" : C.gold) : C.card,
            color: cat===c ? C.bg : C.cream,
            border:`1px solid ${cat===c ? (c==="儿童套餐"?"#4A7A3A":C.gold) : C.border}`,
            borderRadius:20, padding:"7px 14px", fontSize:11, fontWeight:cat===c?700:400,
            cursor:"pointer", whiteSpace:"nowrap", flexShrink:0, fontFamily:"sans-serif",
          }}>{CAT_ICONS[c]} {c}</button>
        ))}
      </div>

      {/* Kids banner */}
      {cat === "儿童套餐" && (
        <div style={{margin:"12px 16px 0", background:"linear-gradient(135deg,#1A3A0A,#2E5A1A)", border:"1.5px solid #5A8A3A", borderRadius:14, padding:"12px 16px", display:"flex", gap:10, alignItems:"center"}}>
          <span style={{fontSize:26}}>👦🍟</span>
          <div>
            <div style={{fontSize:13, fontWeight:700, color:"#A8D878", fontFamily:"Georgia,serif"}}>儿童套餐</div>
            <div style={{fontSize:11, color:"#7AAA58", fontFamily:"sans-serif"}}>专为小朋友设计，无辣温和，营养均衡</div>
          </div>
        </div>
      )}

      {/* Grid */}
      <div style={{padding:"12px 14px", display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
        {items.map(item => {
          const canHalf = item.half === true;
          const por = canHalf ? getPortion(item.id) : "full";
          const isHalf = canHalf && por === "half";
          const q = getQty(item.id, por);
          const hasAny = getQty(item.id,"full")>0 || getQty(item.id,"half")>0;
          const isKids = item.cat === "儿童套餐";

          return (
            <div key={item.id} style={{
              background: hasAny ? (isKids?"linear-gradient(135deg,#2A5A1A22,#1C1409)":`linear-gradient(135deg,${C.goldD}22,${C.card})`) : C.card,
              border:`2px solid ${hasAny?(isKids?"#5A8A3A":C.goldD):C.border}`,
              borderRadius:16, padding:"12px 10px", transition:"all 0.2s",
            }}>
              <div style={{fontSize:30, textAlign:"center", marginBottom:6}}>{item.emoji}</div>

              <div style={{display:"flex", alignItems:"center", gap:4, marginBottom:2, flexWrap:"wrap"}}>
                <span style={{fontSize:11, fontWeight:700, color:C.cream}}>{item.zh}</span>
                {item.hot && <Badge text="热销" />}
                {isKids && <Badge text="儿童" color={C.green} />}
              </div>

              <div style={{fontSize:9, color:C.creamD, fontFamily:"sans-serif", marginBottom:4}}>{item.en}</div>
              {item.desc && <div style={{fontSize:9, color:C.creamD, fontFamily:"sans-serif", marginBottom:6, lineHeight:1.4}}>{item.desc}</div>}

              {/* Half/Full toggle */}
              {canHalf && (
                <div style={{display:"flex", borderRadius:8, overflow:"hidden", border:`1px solid ${C.border}`, marginBottom:8}}>
                  {["full","half"].map(p => (
                    <button key={p} onClick={() => setPortionTab(prev => ({...prev,[item.id]:p}))} style={{
                      flex:1, padding:"5px 0", border:"none", cursor:"pointer",
                      background: por===p ? (p==="full"?C.gold:C.ember) : C.card,
                      color: por===p ? C.bg : C.creamD,
                      fontSize:10, fontWeight:por===p?800:400, fontFamily:"sans-serif",
                    }}>
                      {p==="full"?"整份":"半份"}
                      {getQty(item.id,p)>0 && <span style={{display:"inline-block",width:4,height:4,borderRadius:"50%",background:C.white,marginLeft:3,verticalAlign:"middle"}} />}
                    </button>
                  ))}
                </div>
              )}

              {/* Price + qty */}
              <div style={{display:"flex", alignItems:"center", justifyContent:"space-between"}}>
                <div>
                  {item.price !== null ? (
                    <>
                      <span style={{fontSize:14, fontWeight:800, color:C.goldL, fontFamily:"Georgia,serif"}}>
                        ${isHalf ? halfP(item.price).toFixed(2) : item.price.toFixed(2)}
                      </span>
                      <span style={{fontSize:8, color:C.creamD, fontFamily:"sans-serif", marginLeft:2}}>AUD</span>
                    </>
                  ) : (
                    <span style={{fontSize:11, color:C.creamD, fontFamily:"sans-serif"}}>时价</span>
                  )}
                </div>
                <div style={{display:"flex", alignItems:"center", gap:5}}>
                  {q > 0 && (
                    <>
                      <button onClick={() => sub(item.id, por)} style={{width:24,height:24,borderRadius:"50%",background:C.border,border:"none",color:C.cream,fontSize:15,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
                      <span style={{color:C.goldL,fontWeight:700,minWidth:14,textAlign:"center",fontFamily:"sans-serif",fontSize:13}}>{q}</span>
                    </>
                  )}
                  {item.price !== null && (
                    <button onClick={() => add(item, por)} style={{
                      width:24, height:24, borderRadius:"50%", border:"none",
                      background: isHalf ? `linear-gradient(135deg,${C.ember},${C.flame})` : `linear-gradient(135deg,${C.gold},${C.orange})`,
                      color:C.bg, fontSize:17, cursor:"pointer",
                      display:"flex", alignItems:"center", justifyContent:"center", fontWeight:900,
                    }}>+</button>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:18,padding:"18px",marginBottom:12}}>
          <div style={{fontSize:13,color:C.gold,fontWeight:700,marginBottom:12,fontFamily:"sans-serif"}}>🍽 主菜详情</div>
          {fish && <Row label={`${modeName} · ${fish.zh}`} value={`$${fish.price} AUD`} hi />}
          {sel.numbing && <Row label="麻度" value={NUMBING.find(n=>n.id===sel.numbing)?.zh||""} />}
          {sel.spicy && <Row label="辣度" value={SPICY.find(s=>s.id===sel.spicy)?.zh||""} />}
          {sel.qty && <Row label="下鱼方式" value={sel.qty==="full"?"全入辣锅":sel.qty==="half"?"半入辣锅":"自行涮煮"} />}
          {sel.broths?.length > 0 && <Row label="锅底" value={sel.broths.map(id=>BROTHS.find(b=>b.id===id)?.zh).join(" + ")} />}
          {potPrice > 0 && <Row label="锅底费" value={`$${potPrice.toFixed(2)} AUD`} />}
          <Row label={`调料费 (${guests} 位 × $3.50)`} value={`$${condimentFee.toFixed(2)} AUD`} />
        </div>

        {cart.length > 0 && (
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:18,padding:"18px",marginBottom:12}}>
            <div style={{fontSize:13,color:C.gold,fontWeight:700,marginBottom:12,fontFamily:"sans-serif"}}>➕ 加购配菜</div>
            {cart.map(item => (
              <Row key={item.cKey||item.id} label={`${item.zh} × ${item.qty}`} value={`$${(item.price*item.qty).toFixed(2)} AUD`} />
            ))}
          </div>
        )}

        <div style={{background:`linear-gradient(135deg,${C.goldD}33,${C.card})`,border:`2px solid ${C.goldD}`,borderRadius:18,padding:"16px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <span style={{fontSize:15,fontWeight:700,color:C.cream}}>合计</span>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:26,fontWeight:900,color:C.goldL}}>${total.toFixed(2)}</div>
            <div style={{fontSize:10,color:C.creamD,fontFamily:"sans-serif"}}>AUD · 含调料费</div>
          </div>
        </div>

        <Btn label="🎉 确认下单" onClick={onConfirm} style={{boxShadow:`0 4px 20px rgba(180,60,20,0.5)`}} />
      </div>
    </div>
  );
}

/* ── GUEST COUNT ── */

  return (
    <div style={{minHeight:"100vh",background:C.bg,color:C.cream,fontFamily:"Georgia,serif",display:"flex",flexDirection:"column"}}>
      {/* Header */}
      <div style={{padding:"18px 20px 14px",background:C.surface,borderBottom:`1px solid ${C.border}`}}>
        <div style={{fontSize:22,fontWeight:800,color:C.goldL,letterSpacing:3}}>香海鲜鱼庄</div>
        <div style={{fontSize:10,color:C.creamD,letterSpacing:5,marginTop:2}}>SEA & SPICE</div>
      </div>

      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"30px 24px"}}>
        <div style={{fontSize:48,marginBottom:16}}>🪑</div>
        <div style={{fontSize:22,fontWeight:800,color:C.cream,marginBottom:8,textAlign:"center"}}>今天几位用餐？</div>
        <div style={{fontSize:13,color:C.creamD,fontFamily:"sans-serif",marginBottom:36,textAlign:"center"}}>
          调料费 $3.50/位将自动计入账单
        </div>

        {/* Counter */}
        <div style={{display:"flex",alignItems:"center",gap:24,marginBottom:40}}>
          <button onClick={() => setCount(c => Math.max(1,c-1))} style={{
            width:52,height:52,borderRadius:"50%",border:`2px solid ${C.border}`,
            background:C.card,color:C.cream,fontSize:26,cursor:"pointer",
            display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,
          }}>−</button>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:56,fontWeight:900,color:C.goldL,lineHeight:1}}>{count}</div>
            <div style={{fontSize:13,color:C.creamD,fontFamily:"sans-serif",marginTop:4}}>位</div>
          </div>
          <button onClick={() => setCount(c => Math.min(20,c+1))} style={{
            width:52,height:52,borderRadius:"50%",border:`2px solid ${C.border}`,
            background:C.card,color:C.cream,fontSize:26,cursor:"pointer",
            display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,
          }}>+</button>
        </div>

        {/* Quick select */}
        <div style={{display:"flex",gap:10,marginBottom:36}}>
          {[1,2,3,4,5,6].map(n => (
            <button key={n} onClick={() => setCount(n)} style={{
              width:44,height:44,borderRadius:"50%",
              border:`2px solid ${count===n ? C.gold : C.border}`,
              background: count===n ? `linear-gradient(135deg,${C.gold},${C.goldL})` : C.card,
              color: count===n ? C.bg : C.cream,
              fontSize:15,fontWeight:count===n?800:400,cursor:"pointer",fontFamily:"sans-serif",
            }}>{n}</button>
          ))}
        </div>

        {/* Fee preview */}
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"14px 20px",marginBottom:28,textAlign:"center",minWidth:200}}>
          <div style={{fontSize:12,color:C.creamD,fontFamily:"sans-serif",marginBottom:4}}>调料费小计</div>
          <div style={{fontSize:22,fontWeight:900,color:C.goldL}}>
            ${(count * 3.50).toFixed(2)} <span style={{fontSize:12,fontWeight:400,color:C.creamD}}>AUD</span>
          </div>
          <div style={{fontSize:10,color:C.creamF,fontFamily:"sans-serif",marginTop:2}}>{count} 位 × $3.50</div>
        </div>

        <Btn label="开始点单 →" onClick={() => onConfirm(count)} style={{maxWidth:320,width:"100%"}} />
      </div>

}


function Success({ onRestart }) {
  return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center",padding:40,fontFamily:"Georgia,serif"}}>
      <div style={{fontSize:72,marginBottom:20}}>🎉</div>
      <div style={{fontSize:24,fontWeight:900,color:C.goldL,marginBottom:8}}>下单成功！</div>
      <div style={{fontSize:14,color:C.cream,marginBottom:6,fontFamily:"sans-serif"}}>您的美食正在精心烹制中</div>
      <div style={{fontSize:12,color:C.creamD,marginBottom:32,fontFamily:"sans-serif"}}>预计 15–20 分钟上菜，请稍候享用</div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"14px 20px",marginBottom:28,fontSize:12,color:C.creamD,fontFamily:"sans-serif",maxWidth:280,lineHeight:1.7}}>
        💡 如需服务员协助点火或加汤，请随时招手
      </div>
      <button onClick={onRestart} style={{background:`linear-gradient(135deg,${C.gold},${C.orange})`,color:C.bg,border:"none",borderRadius:14,padding:"13px 32px",fontSize:15,fontWeight:800,cursor:"pointer",fontFamily:"Georgia,serif"}}>
        返回首页
      </button>
    </div>
  );
}

/* ── APP ── */
function App() {
  const [screen, setScreen] = useState("guests");
  const [sel, setSel] = useState({});
  const [cart, setCart] = useState([]);
  const [guests, setGuests] = useState(2);

  const go = (s, extra={}) => { setSel(p => ({...p,...extra})); setScreen(s); };
  const reset = () => { setScreen("guests"); setSel({}); setCart([]); setGuests(2); };

  if (screen === "guests") return <GuestCount onConfirm={n => { setGuests(n); setScreen("home"); }} />;

  if (screen === "home") return <Home onSelect={mode => {
    setSel({mode});
    if (mode === "fhp")     setScreen("fish_fhp");
    if (mode === "cold")    { setSel({mode, cooking:"cold"});    setScreen("fish_direct"); }
    if (mode === "pickled") { setSel({mode, cooking:"pickled"}); setScreen("fish_direct"); }
    if (mode === "hotpot")  setScreen("broth_hp");
    if (mode === "addons")  setScreen("addons");
  }} />;

  /* ── 鱼火锅 flow ── */
  if (screen === "fish_fhp") return <FishPage cooking="fhp"
    onBack={() => setScreen("home")}
    onNext={fish => go("spice_fhp", {fish})}
  />;
  if (screen === "spice_fhp") return <SpicePage
    onBack={() => setScreen("fish_fhp")}
    onNext={({numb,spicy}) => go("qty_fhp", {numb,spicy})}
  />;
  if (screen === "qty_fhp") return <QtyPage
    onBack={() => setScreen("spice_fhp")}
    onNext={qty => go("broth_fhp", {qty})}
  />;
  if (screen === "broth_fhp") return <BrothPage mode="single"
    titleText="选择内圈锅底" subText="鱼吃完后继续涮"
    onBack={() => setScreen("qty_fhp")}
    onNext={broths => go("addons", {broths})}
  />;

  /* ── 单点鱼 flow ── */
  if (screen === "fish_direct") return <FishPage cooking={sel.cooking}
    onBack={() => setScreen("home")}
    onNext={fish => {
      if (sel.cooking === "cold") go("spice_direct", {fish});
      else go("qty_direct", {fish});
    }}
  />;
  if (screen === "spice_direct") return <SpicePage
    onBack={() => setScreen("fish_direct")}
    onNext={({numb,spicy}) => go("qty_direct", {numb,spicy})}
  />;
  if (screen === "qty_direct") return <QtyPage
    onBack={() => sel.cooking==="cold" ? setScreen("spice_direct") : setScreen("fish_direct")}
    onNext={qty => go("broth_direct", {qty})}
  />;
  if (screen === "broth_direct") return <BrothPage mode="single"
    titleText="🚀 升级鱼火锅？" subText="加一个锅底，鱼吃完继续涮"
    allowSkip
    onBack={() => setScreen("qty_direct")}
    onNext={broths => go("addons", {broths})}
  />;

  /* ── 单点火锅 flow ── */
  if (screen === "broth_hp") return <BrothPage mode="choose"
    titleText="选择锅型与锅底"
    onBack={() => setScreen("home")}
    onNext={broths => go("addons", {broths})}
  />;

  /* ── Addons ── */
  if (screen === "addons") return (
    <>
      <AddonsPage cart={cart} setCart={setCart} onBack={() => {
        const m = sel.mode;
        if (m==="addons")  setScreen("home");
        else if (m==="fhp")     setScreen("broth_fhp");
        else if (m==="hotpot")  setScreen("broth_hp");
        else setScreen("broth_direct");
      }} />
      <CartBar cart={cart} onCheckout={() => setScreen("summary")} />
      {cart.length === 0 && (
        <div style={{position:"fixed",bottom:0,left:0,right:0,padding:"12px 20px",background:C.surface,borderTop:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:12,color:C.creamD,fontFamily:"sans-serif"}}>配菜可跳过</span>
          <button onClick={() => setScreen("summary")} style={{background:C.card,border:`1px solid ${C.border}`,color:C.cream,borderRadius:10,padding:"8px 16px",fontSize:12,cursor:"pointer",fontFamily:"sans-serif"}}>
            跳过 → 确认下单
          </button>
        </div>
      )}
    </>
  );

  if (screen === "summary") return <Summary cart={cart} sel={sel} guests={guests}
    onBack={() => setScreen("addons")}
    onConfirm={() => setScreen("success")}
  />;

  if (screen === "success") return <Success onRestart={reset} />;

  return null;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
